name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test + cross-target check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: unit tests
        run: |
          zig build test
          zig build test -Doptimize=ReleaseSafe

      - name: cross-target check
        run: zig build check

      - name: libmpv runtime load
        run: |
          sudo apt-get update && sudo apt-get install -y libmpv2
          zig build
          ./zig-out/bin/hum doctor | tee doctor.txt
          grep -E '^  libmpv +libmpv\.so' doctor.txt
