name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: all targets
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: test
        run: zig build test

      - name: build
        run: |
          set -e
          for t in aarch64-macos x86_64-macos x86_64-linux-gnu aarch64-linux-gnu x86_64-freebsd; do
            zig build -Doptimize=ReleaseSafe -Dtarget=$t --prefix out/$t
          done
          mkdir -p out/macos-universal/bin
          lipo -create -output out/macos-universal/bin/hum out/aarch64-macos/bin/hum out/x86_64-macos/bin/hum
          file out/*/bin/hum

      - name: package
        run: |
          set -e
          pack() { tar -czf "hum-$1.tar.gz" -C "out/$2/bin" hum; }
          pack macos-universal macos-universal
          pack linux-x86_64 x86_64-linux-gnu
          pack linux-arm64 aarch64-linux-gnu
          pack freebsd-x86_64 x86_64-freebsd

      - uses: softprops/action-gh-release@v3
        with:
          files: hum-*.tar.gz
